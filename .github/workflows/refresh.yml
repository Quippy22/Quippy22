name: Refresh card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh.py

      - name: Build the card
        run: cargo run --release

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "stats and card are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card.svg assets/stats.txt
          git commit -m "chore: refresh card"
          git push
